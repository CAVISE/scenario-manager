# What the CAVISE/OpenCDA fork accepts in a scenario config, taken from the
# commit below. default.yaml next to this file is copied from the same commit.
# Update both files together.
source:
  repository: CAVISE/OpenCDA
  commit: 1ee39adb155754ebe16c3aeb008594f26a22cc5c

# opencda/core/application/behavior/services/<name>/service.py
services:
  self_informer:
    params: [priority]
  default_movement_request:
    params: [priority]
  movement_controller:
    params: [priority]
  aim_client:
    params: [priority, debug]
    requires: [self_informer, movement_controller]
  aim_server:
    # model, underling_model, hidden_channels and weights are passed to the
    # AIM model, which ignores any other key.
    params:
      - priority
      - control_radius
      - control_center_location
      - debug
      - model
      - underling_model
      - hidden_channels
      - weights
    ignores_unknown_params: true
    # Models registered in AIM/models.
    choices:
      model: [MTP]
    requires_unless:
      control_center_location: [self_informer]

# opencda/core/attack/adversary_framework/attacks/<name>/config.yaml
attacks:
  aim_client_identity_spoofing: &aim_attack
    requires:
      - {node_type: rsu, service: aim_server}
      - {node_type: vehicle, service: aim_client}
  aim_client_request_position_spoofing: *aim_attack
  aim_client_request_speed_spoofing: *aim_attack
  aim_client_reservation_stealing: *aim_attack
  aim_client_response_sniffer: *aim_attack
  aim_server_request_ddos: *aim_attack
  aim_server_request_replay: *aim_attack
  aim_server_response_jamming: *aim_attack
  aim_server_response_replay: *aim_attack
  aim_server_trajectory_spoofing: *aim_attack

# opencda/metrics_tools: every registered metric and its parameters.
metrics:
  speed: [warmup_steps, dt]
  acceleration: [warmup_steps, dt]
  ttc: [warmup_steps]
  hard_brake_count: [warmup_steps, dt, deceleration_threshold, reset_threshold]
  time_gap: [warmup_steps]
  distance_gap: [warmup_steps]
  trace: [warmup_steps]
  collision_count: [warmup_steps]
  identity_conflict_count: [warmup_steps]
  near_miss_count: [warmup_steps, distance_threshold]
  ap_at_iou: [warmup_steps, global_sort_detections, confidence_threshold]
  mean_recall_at_iou: [warmup_steps, global_sort_detections]
  mean_precision_at_iou: [warmup_steps, global_sort_detections]
  attack_success_rate: [warmup_steps, iou_threshold]
  attacker_target_confidence: [warmup_steps, iou_threshold]
  attacker_benign_visibility_ratio: [warmup_steps, epsilon]

# Metric blocks the fork collects, and the metrics that record data there.
metric_blocks:
  root:
    coperception.metrics:
      - ap_at_iou
      - mean_recall_at_iou
      - mean_precision_at_iou
      - attack_success_rate
      - attacker_benign_visibility_ratio
      - attacker_target_confidence
  cav:
    behavior.metrics: [speed, acceleration, ttc, hard_brake_count]

# opencda/assets/blueprint_meta: metadata files and their vehicle classes.
blueprint_meta:
  opencda/assets/blueprint_meta/bbx_stats_0915.json:
    [car, suv, bicycle, motorcycle, truck, bus]

# Keys that Scenario Manager writes and the fork never reads. Root keys are
# relative to the config root, agent keys to vehicle_base, rsu_base,
# agent_base and every agent entry. Only keys set in the scenario count, so
# the ones that also sit in default.yaml are reported too.
ignored_keys:
  root:
    world.client_host: the CARLA host is set with the --carla-host flag
    traffic_manager: use carla_traffic_manager
    carla_traffic_manager.port: the Traffic Manager always uses port 8000
    cooperative_perception_visualization: use the coperception section
    platoon_base: platoons are not supported
  agent:
    v2x: V2X settings are not configurable
    sensing.localization.navigation_source: use sensing.localization.provider
    sensing.localization.metrics: no localization metrics are collected
    sensing.localization.debug_helper: not supported
    sensing.localization.gnss.heading_direction_stddev: not used by the GNSS sensor
    sensing.localization.gnss.speed_stddev: not used by the GNSS sensor
    sensing.perception.detection_range: perception range is not configurable
    sensing.perception.traffic_light_thresh: not used
    behavior.static_obstacle_avoidance_enabled: not supported
    behavior.overtake_counter_recover: fixed at 100 in the fork
    behavior.color: not supported
