name: Scenario Manager Tests

on:
  push:
  pull_request:

jobs:
  frontend:
    uses: CAVISE/pipelines/.github/workflows/node-yarn-vitest.yml@a8fed47bad4f45ff07ee7ecfc875a12d80f7e7e9 # main
    with:
      node-version: "22"
      working-directory: frontend
      cache-dependency-path: frontend/yarn.lock
      coverage: true

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build backend test image
        run: docker build --target test --tag scenario-manager-backend-test .
      - name: Test backend in Docker
        run: docker run --rm scenario-manager-backend-test
