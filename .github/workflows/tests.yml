name: Scenario Manager Tests

on:
  push:
  pull_request:

jobs:
  frontend:
    uses: CAVISE/pipelines/.github/workflows/node-yarn-vitest.yml@a8fed47bad4f45ff07ee7ecfc875a12d80f7e7e9 # main
    with:
      node-version: "22"
      working-directory: frontend
      cache-dependency-path: frontend/yarn.lock
      coverage: true

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install backend dependencies
        run: uv sync --frozen --group dev
      - name: Test backend
        run: |
          mkdir -p reports
          uv run --frozen pytest tests/backend \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov
      - name: Add coverage summary
        if: always()
        run: |
          echo "## Backend coverage" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f .coverage ]]; then
            uv run --frozen coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage data was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage
          path: |
            reports/coverage.xml
            reports/htmlcov
          if-no-files-found: warn
          retention-days: 14
