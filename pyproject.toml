[project]
name = "scenario-manager"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.139.0",
    "omegaconf>=2.3.1",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
