description: |-
  OpenCDA scenario generated by ScenarioManager
  Town: Town03 | Vehicles: 1 | RSUs: 1

attacks: []

world:
  town: Town03
  weather:
    sun_altitude_angle: 75
    cloudiness: 0
    precipitation: 0
    precipitation_deposits: 0
    wind_intensity: 0
    fog_density: 0
    fog_distance: 0
    fog_falloff: 0
    wetness: 0
  fixed_delta_seconds: 0.05
  sync_mode: true
  client_port: 2000
  seed: 42

blueprint:
  use_multi_class_bp: false
  bp_meta_path: opencda/assets/blueprint_meta/bbx_stats_0912.json
  bp_class_sample_prob:
    car: 0.5
    truck: 0.1
    bus: 0.1
    bicycle: 0.1
    motorcycle: 0.1

rsu_base:
  sensing:
    perception:
      activate: false
      camera:
        visualize: 0
        num: 1
        positions:
          - [2.5, 0, 1.0, 0]
      lidar:
        visualize: false
        channels: 32
        range: 50
        points_per_second: 100000
        rotation_frequency: 20
        upper_fov: 10
        lower_fov: -30
        dropoff_general_rate: 0
        dropoff_intensity_limit: 1
        dropoff_zero_intensity: 0
        noise_stddev: 0
    localization:
      activate: true
      dt: ${world.fixed_delta_seconds}
      gnss:
        noise_alt_stddev: 0.001
        noise_lat_stddev: 0.000001
        noise_lon_stddev: 0.000001
        heading_direction_stddev: 0.1
        speed_stddev: 0.2
      debug_helper:
        show_animation: false
        x_scale: 1
        y_scale: 100

vehicle_base:
  sensing:
    perception:
      activate: false
      camera:
        visualize: 0
        num: 1
        positions:
          - [2.5, 0, 1.0, 0]
      lidar:
        visualize: false
        channels: 32
        range: 50
        points_per_second: 100000
        rotation_frequency: 20
        upper_fov: 10
        lower_fov: -30
        dropoff_general_rate: 0
        dropoff_intensity_limit: 1
        dropoff_zero_intensity: 0
        noise_stddev: 0
    localization:
      activate: true
      navigation_source: estimated
      dt: ${world.fixed_delta_seconds}
      gnss:
        noise_alt_stddev: 0.001
        noise_lat_stddev: 0.000001
        noise_lon_stddev: 0.000001
        heading_direction_stddev: 0.1
        speed_stddev: 0.2
      debug_helper:
        show_animation: false
        x_scale: 1
        y_scale: 100
  behavior:
    max_speed: 45
    tailgate_speed: 55
    speed_lim_dist: 5
    speed_decrease: 15
    safety_time: 4
    emergency_param: 0.4
    ignore_traffic_light: true
    overtake_allowed: true
    collision_time_ahead: 1.5
    overtake_counter_recover: 35
    sample_resolution: 2
    static_obstacle_avoidance_enabled: false
    local_planner:
      buffer_size: 12
      trajectory_update_freq: 15
      waypoint_update_freq: 9
      min_dist: 3
      trajectory_dt: 0.2
      debug: true
      debug_trajectory: true
  map_manager:
    pixels_per_meter: 2
    raster_size: [224, 224]
    lane_sample_resolution: 0.1
    visualize: false
    activate: true
  safety_manager:
    print_message: true
    collision_sensor:
      history_size: 30
      col_thresh: 1
    stuck_dector:
      len_thresh: 500
      speed_thresh: 0.5
    offroad_dector: []
    traffic_light_detector:
      light_dist_thresh: 20
  controller:
    type: pid_controller
    args:
      lat:
        k_p: 0.75
        k_d: 0.02
        k_i: 0.4
      lon:
        k_p: 0.37
        k_d: 0.024
        k_i: 0.032
      dynamic: false
      dt: ${world.fixed_delta_seconds}
      max_brake: 1
      max_throttle: 1
      max_steering: 0.45
  v2x:
    enabled: true
    communication_range: 35
    position_source: estimated

sumo:
  port: 3000
  host: sumo
  gui: true
  client_order: 1
  step_length: ${world.fixed_delta_seconds}

carla_traffic_manager:
  port: 8001
  sync_mode: true
  global_speed_perc: -100
  global_distance: 5
  auto_lane_change: false
  set_osm_mode: true
  random: false
  ignore_lights_percentage: 0
  ignore_signs_percentage: 0
  ignore_walkers_percentage: 0
  ignore_vehicles_percentage: 0
  random_left_lanechange_percentage: 0
  random_right_lanechange_percentage: 0
  vehicle_list: []
  range: []

traffic_manager:
  global_distance_to_leading_vehicle: 5
  synchronous_mode: true

scenario:
  rsu_list:
    - name: rsu1
      spawn_position: [1.00, 2.00, 3.00, 0, 0, 0]
      id: -1
      v2x:
        communication_range: 300
        tx_power: 23
        frequency: 5900000000
        protocol: "ITS-G5"
        beacon_interval: 100
      sensing:
        perception:
          activate: false
          detection_range: 100
          camera:
            visualize: 0
            num: 1
            positions:
              - [2.5, 0, 1.0, 0]
          lidar:
            visualize: false
            channels: 32
            range: 50
            points_per_second: 100000
            rotation_frequency: 20
            upper_fov: 10
            lower_fov: -30
            dropoff_general_rate: 0
            dropoff_intensity_limit: 1
            dropoff_zero_intensity: 0
            noise_stddev: 0
        localization:
          activate: true
          dt: ${world.fixed_delta_seconds}
          gnss:
            noise_alt_stddev: 0.001
            noise_lat_stddev: 0.000001
            noise_lon_stddev: 0.000001
  single_cav_list:
    - name: cav1
      spawn_position: [1.00, 2.00, 0.00, 0, 0.0, 0]
      destination: [10.00, 20.00, 0.00]
      id: 100
