services:
  backend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "8000:8000"
    volumes:
      - simulation_results:/app/evaluation_outputs
      - simulation_xodrs:/app/assets/xodrs
    env_file:
      - ./.env
    environment:
      RUN_MIGRATIONS: "1"
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_BOOTSTRAP_ADMIN_EMAIL: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:-}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cavise
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      artifact-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  simulation-worker:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: ["python", "-m", "app.run_worker"]
    volumes:
      - simulation_results:/app/evaluation_outputs
      - simulation_xodrs:/app/assets/xodrs
    env_file:
      - ./.env
    environment:
      RUN_MIGRATIONS: "0"
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_BOOTSTRAP_ADMIN_EMAIL: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:-}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cavise
    # A second worker must never share the one configured CARLA endpoint.
    # The PostgreSQL advisory lock provides the runtime enforcement.
    restart: on-failure
    deploy:
      replicas: 1
    depends_on:
      backend:
        condition: service_healthy

  artifact-init:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    user: "0:0"
    command:
      - sh
      - -ec
      - |
        mkdir -p /app/evaluation_outputs /app/assets/xodrs
        marker=/app/evaluation_outputs/.legacy-imported
        if [ ! -e "$$marker" ]; then
          for source in /legacy-results/*; do
            [ -d "$$source" ] || continue
            target="/app/evaluation_outputs/$$(basename "$$source")"
            [ -e "$$target" ] || cp -a "$$source" "$$target"
          done
          touch "$$marker"
        fi
        chown -R 10001:10001 /app/evaluation_outputs /app/assets/xodrs
    volumes:
      - simulation_results:/app/evaluation_outputs
      - simulation_xodrs:/app/assets/xodrs
      - ./evaluation_outputs:/legacy-results:ro
    restart: "no"

  frontend-prod:
    profiles: [prod]
    build:
      context: frontend
      dockerfile: Dockerfile
      target: production
    ports:
      - "80:8080"
    networks:
      - cavise
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER must be set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cavise
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  simulation_results:
  simulation_xodrs:

networks:
  cavise:
    driver: bridge
